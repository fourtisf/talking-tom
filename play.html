<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#2e2340" />
    <meta name="description" content="Play Biskit — look after a small, very opinionated cat." />
    <title>Biskit</title>

    <!-- Relative on purpose: this page is also the Capacitor bundle's root, and
         there is no server there to resolve "/" against. See index.html. -->
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!--
      Fetched in parallel with the parse rather than after it. Fonts are always
      requested in CORS mode, so `crossorigin` is required even same-origin —
      without it the preload misses and the file is fetched a second time.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/fredoka.woff2" />
    <style>
      /*
        Fredoka, the typeface the design actually calls for. This block sat here
        commented out with a note to "drop the woff2 files into public/fonts/",
        and nobody ever did — so every player saw whatever generic sans their
        platform happens to ship, which is most of what made the game look
        unfinished. The file is now in public/fonts/, SIL Open Font License 1.1,
        licence alongside it.

        RELATIVE path. The commented-out version used "/fonts/…", which resolves
        against a server root that does not exist inside the Capacitor bundle —
        the same reason the icons above are relative.

        Plus Jakarta Sans is NOT shipped: it would be a second 30KB for body
        copy that a platform UI font sets just as well. `FONT_BODY` in
        src/ui/theme.ts no longer asks for it.
      */
      @font-face {
        font-family: 'Fredoka';
        src: url('./fonts/fredoka.woff2') format('woff2');
        font-weight: 400 700;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
      }

      /*
        The game is a 420x860 portrait design. On a wide screen it fills the
        height and is centred, which leaves a margin either side — so the page
        behind it is painted in the room's own colours (lavender wall above,
        warm floor below) rather than a flat slab. The result reads as the room
        continuing past the edges instead of a letterboxed video.
      */
      body {
        /*
          Three bands at the exact heights the game draws them, so the room
          appears to carry on past the canvas rather than stopping at an edge:

            wall  0 -> 51.12%   (scene is 628 of 860 tall; its floor sits at 70%)
            floor 51.12 -> 73.02%
            dock  73.02 -> 100%

          Colours are the same tokens the game uses. If the dock height in
          HomeScene changes, these stops move with it.
        */
        background: linear-gradient(
          180deg,
          #ede4fb 0%,
          #cbb8ec 30%,
          #bca6e4 51.12%,
          #efd3ae 51.12%,
          #d6b085 73.02%,
          #c6b0ec 73.02%,
          #a98cda 84%,
          #7a5fb5 100%
        );
      }

      /*
        Darkens the page away from the centre so the eye settles on the game.
        Kept subtle — too strong and the seam it is meant to hide becomes a
        halo instead.
      */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse 58% 76% at 50% 50%,
          transparent 46%,
          rgba(51, 36, 63, 0.26) 100%
        );
      }

      /*
        A plain block, deliberately: Phaser centres the canvas itself with
        margins, and if CSS also centres it the two offsets stack and the game
        lands off to one side. One centring system, not two.
      */
      #app {
        position: relative;
        width: 100%;
        height: 100dvh;
        /* Fallback for browsers without dynamic viewport units. */
        height: 100vh;
        height: 100dvh;
      }

      canvas {
        display: block;
        touch-action: none;
      }

      /* A quiet way back to the landing page. Hidden on phones, where the game
         is the whole screen and the browser's own back button is right there. */
      #back {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 10;
        display: none;
        align-items: center;
        gap: 8px;
        padding: 9px 17px 9px 13px;
        border-radius: 99px;
        color: #fff;
        background: rgba(51, 36, 63, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        font: 700 13.5px/1 system-ui, sans-serif;
        text-decoration: none;
        transition: background 0.18s, transform 0.18s;
      }
      #back:hover {
        background: rgba(51, 36, 63, 0.72);
        transform: translateX(-2px);
      }
      @media (min-width: 760px) {
        #back {
          display: inline-flex;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!--
      Relative on purpose, and NOT "/". This is the one author-written page that
      also ships inside Capacitor, where `--mode app` renames it to index.html
      and there is no landing page and no /play route — an absolute "/" would
      dead-end in the native app. On the web it costs exactly one hop:
      /index.html 301s to /.
    -->
    <a id="back" href="./index.html" aria-label="Back to the Biskit home page">← Back</a>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
