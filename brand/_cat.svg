<svg viewBox="0 0 300 360" role="img" aria-label="Biskit, a small white cat">
  <defs>
    <radialGradient id="iris" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#8fd4f7" />
      <stop offset="55%" stop-color="#4ba8e8" />
      <stop offset="100%" stop-color="#2a72b8" />
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ede2f6" />
    </linearGradient>
  </defs>

  <g>
    <path
      d="M206 306C274 316 300 258 288 202C280 164 246 158 242 194"
      fill="none"
      stroke="#7a6494"
      stroke-width="40"
      stroke-linecap="round"
    />
    <path
      d="M206 306C274 316 300 258 288 202C280 164 246 158 242 194"
      fill="none"
      stroke="url(#fur)"
      stroke-width="28"
      stroke-linecap="round"
    />
  </g>

  <!--
    Outlines are stroked at 12 and then filled over, so exactly 6
    shows on every part: the torso used to carry half the weight of
    the head and limbs and the character had no single silhouette.
    Where a limb meets the body the line simply stops.
  -->

  <!-- Feet sit behind the torso, which buries their top third. -->
  <g stroke="#7a6494" stroke-width="12" paint-order="stroke fill" fill="url(#fur)">
    <ellipse cx="114" cy="330" rx="30" ry="21" />
    <ellipse cx="186" cy="330" rx="30" ry="21" />
  </g>
  <g fill="#ffffff">
    <ellipse cx="114" cy="333" rx="22" ry="12" />
    <ellipse cx="186" cy="333" rx="22" ry="12" />
  </g>
  <g fill="#ffc4d6">
    <ellipse cx="114" cy="340" rx="10" ry="6" />
    <ellipse cx="103" cy="331" rx="4.3" ry="4" />
    <ellipse cx="114" cy="328.5" rx="4.3" ry="4" />
    <ellipse cx="125" cy="331" rx="4.3" ry="4" />
    <ellipse cx="186" cy="340" rx="10" ry="6" />
    <ellipse cx="175" cy="331" rx="4.3" ry="4" />
    <ellipse cx="186" cy="328.5" rx="4.3" ry="4" />
    <ellipse cx="197" cy="331" rx="4.3" ry="4" />
  </g>

  <!-- The torso outline is broken where the feet cross it, so a foot
       joins the body instead of being an outlined blob with a second
       line drawn across its top. -->
  <path
    d="M158.3 330.6A65 53 0 0 1 141.7 330.6M101.5 313.3A65 53 0 1 1 198.5 313.3"
    fill="none"
    stroke="#7a6494"
    stroke-width="12"
    stroke-linecap="round"
  />
  <ellipse cx="150" cy="278" rx="65" ry="53" fill="url(#fur)" />

  <!-- Chest ruff. The head circle and the torso cross at a notch on
       each shoulder; this fills it so the two read as one animal. -->
  <path
    d="M94 252Q100 244 108 237Q116 234 122 232Q128 218 136 215Q144 217 150 224Q156 217 164 215Q172 218 178 232Q184 234 192 237Q200 244 206 252"
    fill="none"
    stroke="#7a6494"
    stroke-width="12"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <path
    d="M94 252Q100 244 108 237Q116 234 122 232Q128 218 136 215Q144 217 150 224Q156 217 164 215Q172 218 178 232Q184 234 192 237Q200 244 206 252L206 304L94 304Z"
    fill="#ede2f6"
  />
  <path
    d="M94 265Q100 257 108 250Q116 247 122 245Q128 231 136 228Q144 230 150 237Q156 230 164 228Q172 231 178 245Q184 247 192 250Q200 257 206 265L206 317L94 317Z"
    fill="#ffffff"
  />

  <!-- Belly marking: no outline, and a chest blaze running up under
       the chin, so it reads as fur rather than a bib laid over. -->
  <ellipse cx="150" cy="269" rx="23" ry="22" fill="#ff9ec4" />
  <ellipse cx="150" cy="290" rx="33" ry="30" fill="#ff9ec4" />
  <path
    d="M150 279c-6-10-20-6-20 4 0 9 13 16 20 22 7-6 20-13 20-22 0-10-14-14-20-4z"
    fill="#fff3f8"
  />

  <!-- Arms are outlined only on the arc that clears the torso: a
       closed ring reads as a mitten laid on the belly, not an arm. -->
  <g fill="none" stroke="#7a6494" stroke-width="12" stroke-linecap="round">
    <path d="M202.8 261.9A20 27 0 1 1 192.7 305.4" />
    <path d="M97.2 261.9A20 27 0 1 0 107.3 305.4" />
  </g>
  <g fill="url(#fur)">
    <ellipse cx="92" cy="288" rx="20" ry="27" />
    <ellipse cx="208" cy="288" rx="20" ry="27" />
  </g>
  <g fill="#ffffff">
    <ellipse cx="92" cy="301" rx="15" ry="13" />
    <ellipse cx="208" cy="301" rx="15" ry="13" />
  </g>
  <g fill="#ffc4d6">
    <ellipse cx="92" cy="307" rx="8.5" ry="6" />
    <ellipse cx="83.5" cy="297" rx="4" ry="4.3" />
    <ellipse cx="92" cy="294" rx="4" ry="4.3" />
    <ellipse cx="100.5" cy="297" rx="4" ry="4.3" />
    <ellipse cx="208" cy="307" rx="8.5" ry="6" />
    <ellipse cx="199.5" cy="297" rx="4" ry="4.3" />
    <ellipse cx="208" cy="294" rx="4" ry="4.3" />
    <ellipse cx="216.5" cy="297" rx="4" ry="4.3" />
  </g>

  <g>
    <!-- Ears seat on the skull: a soft leaf with a rounded tip whose
         base chord is buried inside the head, with the inner pink
         following the shell rather than being a second triangle.
         The skull outline is left open where each one crosses it. -->
    <g stroke="#7a6494" stroke-width="12" paint-order="stroke fill">
      <path
        d="M174 100Q180 64 197 36Q212 22 227 42Q236 76 220 108Z"
        fill="url(#fur)"
      />
      <path
        d="M126 100Q120 64 103 36Q88 22 73 42Q64 76 80 108Z"
        fill="url(#fur)"
      />
    </g>
    <g fill="#ffc4d6">
      <path d="M185.9 97.6Q189.9 73.9 201.1 55.4Q211 46.1 220.9 59.3Q226.8 81.8 216.3 102.9Z" />
      <path d="M114.1 97.6Q110.1 73.9 98.9 55.4Q89 46.1 79.1 59.3Q73.2 81.8 83.7 102.9Z" />
    </g>

    <path
      d="M224.5 88.6A94 94 0 1 1 75.5 88.6M111.7 60.2A94 94 0 0 1 188.3 60.2"
      fill="none"
      stroke="#7a6494"
      stroke-width="12"
      stroke-linecap="round"
    />
    <circle cx="150" cy="146" r="94" fill="url(#fur)" />

    <!-- No fur curl here either — see PetArt.ts. A fur-filled shape
         on a fur-filled skull shows only its outline, so it reads
         as a scratch when low and as a third ear when tall. -->


    <ellipse cx="94" cy="186" rx="22" ry="13" fill="#ff8cb8" opacity=".55" />
    <ellipse cx="206" cy="186" rx="22" ry="13" fill="#ff8cb8" opacity=".55" />

    <!-- The eye carries NO outline. A dark ring around a white oval,
         twice, on a white face, reads as a pair of spectacles — which
         is exactly what it was doing. The iris is grown until it all
         but fills the socket instead, so the saturated blue and the
         pupil carry the shape on their own.

         Highlights sit far enough out to clip the pupil's edge rather
         than bite its centre; overlapping the middle leaves the pupil
         a lopsided comma instead of a disc. Both eyes are lit from the
         same side, not mirrored — mirrored highlights read as a squint. -->
    <g>
      <ellipse cx="100" cy="156" rx="32" ry="36" fill="#fff" />
      <ellipse cx="100" cy="160" rx="29" ry="31" fill="url(#iris)" />
      <circle cx="100" cy="163" r="10.5" fill="#2a2038" />
      <circle cx="88" cy="149" r="8.5" fill="#fff" />
      <circle cx="112" cy="175" r="5" fill="#fff" opacity=".92" />

      <ellipse cx="200" cy="156" rx="32" ry="36" fill="#fff" />
      <ellipse cx="200" cy="160" rx="29" ry="31" fill="url(#iris)" />
      <circle cx="200" cy="163" r="10.5" fill="#2a2038" />
      <circle cx="188" cy="149" r="8.5" fill="#fff" />
      <circle cx="212" cy="175" r="5" fill="#fff" opacity=".92" />
    </g>

    <!-- Lashes stay thin. At a slab weight they read as angry
         eyebrows rather than lashes. -->
    <g stroke="#7a6494" stroke-width="5.4" stroke-linecap="round" fill="none">
      <path d="M78 139Q71 131 63 122M73 150Q66 146 59 142" />
      <path d="M222 139Q229 131 237 122M227 150Q234 146 241 142" />
    </g>

    <!-- Muzzle: two cheek lobes over a shadow, so it sits proud of
         the face rather than being a pale smear. -->
    <ellipse cx="150" cy="211" rx="41" ry="25" fill="#ede2f6" />
    <g fill="#fdf6fb">
      <ellipse cx="131" cy="206" rx="26" ry="22" />
      <ellipse cx="169" cy="206" rx="26" ry="22" />
      <ellipse cx="150" cy="202" rx="31" ry="17" />
    </g>
    <!-- No long whiskers here either — see PetArt.ts. Six strokes
         reaching past the cheeks put more dark line on the face than
         the eyes carry, and they cross the head outline into the
         background, which reads as scratches. Only the roots stay. -->
    <path
      d="M141 194H159L157 200L150 207.5L143 200Z"
      fill="#ff9ec4"
      stroke="#7a6494"
      stroke-width="3.6"
      stroke-linejoin="round"
    />
    <ellipse cx="147" cy="197" rx="3" ry="1.7" fill="#fff3f8" opacity=".75" />
    <g fill="none" stroke="#7a6494" stroke-width="5" stroke-linecap="round">
      <path d="M150 207v3M150 210q-12 15-23-2M150 210q12 15 23-2" />
    </g>
  </g>
</svg>
