<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <title>Biskit</title>
  <!-- Horizontal lockup on transparent, for a README header or a press kit.
       Generated by brand/build.mjs — do not edit by hand. -->
  <defs>
    
    <radialGradient id="iris-ld" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#8fd4f7"/>
      <stop offset="55%" stop-color="#4ba8e8"/>
      <stop offset="100%" stop-color="#2a72b8"/>
    </radialGradient>
    <linearGradient id="fur-ld" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ede2f6"/>
    </linearGradient>
    
    <radialGradient id="lift" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d2c63" stop-opacity=".38"/>
      <stop offset="55%" stop-color="#3d2c63" stop-opacity=".17"/>
      <stop offset="100%" stop-color="#3d2c63" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="cast" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2e2340" flood-opacity=".30"/>
    </filter>
    <filter id="castSm" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#2e2340" flood-opacity=".34"/>
    </filter>
    <linearGradient id="skin-ld" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#e0d2f8"/>
      <stop offset="42%" stop-color="#ab8ede"/>
      <stop offset="100%" stop-color="#63499b"/>
    </linearGradient>
    <radialGradient id="key-ld" cx="50%" cy="16%" r="66%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".52"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-ld"><rect x="0" y="0" width="260" height="260" rx="60" ry="60"/></clipPath>
    <linearGradient id="word-ld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ddccf7"/>
    </linearGradient>
  </defs>

  <g transform="translate(30 40)" filter="url(#castSm)">
    <g clip-path="url(#clip-ld)">
      <rect width="260" height="260" fill="url(#skin-ld)"/>
      <ellipse cx="130" cy="26" rx="161" ry="114" fill="url(#key-ld)"/>
      <ellipse cx="130" cy="234" rx="109" ry="34" fill="url(#lift)"/>
      <g transform="translate(130 135) scale(0.6674) translate(-150 -135.1)">
  <g>
    <!-- Ears seat on the skull: a soft leaf with a rounded tip whose
         base chord is buried inside the head, with the inner pink
         following the shell rather than being a second triangle.
         The skull outline is left open where each one crosses it. -->
    <g stroke="#7a6494" stroke-width="12" paint-order="stroke fill">
      <path
        d="M174 100Q180 64 197 36Q212 22 227 42Q236 76 220 108Z"
        fill="url(#fur-ld)"
      />
      <path
        d="M126 100Q120 64 103 36Q88 22 73 42Q64 76 80 108Z"
        fill="url(#fur-ld)"
      />
    </g>
    <g fill="#ffc4d6">
      <path d="M185.9 97.6Q189.9 73.9 201.1 55.4Q211 46.1 220.9 59.3Q226.8 81.8 216.3 102.9Z" />
      <path d="M114.1 97.6Q110.1 73.9 98.9 55.4Q89 46.1 79.1 59.3Q73.2 81.8 83.7 102.9Z" />
    </g>

    <path
      d="M224.5 88.6A94 94 0 1 1 75.5 88.6M111.7 60.2A94 94 0 0 1 188.3 60.2"
      fill="none"
      stroke="#7a6494"
      stroke-width="12"
      stroke-linecap="round"
    />
    <circle cx="150" cy="146" r="94" fill="url(#fur-ld)" />

    <!-- No fur curl here either — see PetArt.ts. A fur-filled shape
         on a fur-filled skull shows only its outline, so it reads
         as a scratch when low and as a third ear when tall. -->


    <ellipse cx="94" cy="186" rx="22" ry="13" fill="#ff8cb8" opacity=".55" />
    <ellipse cx="206" cy="186" rx="22" ry="13" fill="#ff8cb8" opacity=".55" />

    <!-- The eye carries NO outline. A dark ring around a white oval,
         twice, on a white face, reads as a pair of spectacles — which
         is exactly what it was doing. The iris is grown until it all
         but fills the socket instead, so the saturated blue and the
         pupil carry the shape on their own.

         Highlights sit far enough out to clip the pupil's edge rather
         than bite its centre; overlapping the middle leaves the pupil
         a lopsided comma instead of a disc. Both eyes are lit from the
         same side, not mirrored — mirrored highlights read as a squint. -->
    <g>
      <ellipse cx="100" cy="156" rx="32" ry="36" fill="#fff" />
      <ellipse cx="100" cy="160" rx="29" ry="31" fill="url(#iris-ld)" />
      <circle cx="100" cy="163" r="10.5" fill="#2a2038" />
      <circle cx="88" cy="149" r="8.5" fill="#fff" />
      <circle cx="112" cy="175" r="5" fill="#fff" opacity=".92" />

      <ellipse cx="200" cy="156" rx="32" ry="36" fill="#fff" />
      <ellipse cx="200" cy="160" rx="29" ry="31" fill="url(#iris-ld)" />
      <circle cx="200" cy="163" r="10.5" fill="#2a2038" />
      <circle cx="188" cy="149" r="8.5" fill="#fff" />
      <circle cx="212" cy="175" r="5" fill="#fff" opacity=".92" />
    </g>

    <!-- Lashes are TAPERED (5.6 -> 2.2), so they are filled outlines rather
         than strokes. SVG cannot taper a stroke, and at the flat 5.4 this
         used to be, the tips stayed as heavy as the roots: two long dark
         lines of even weight sitting off each eye read as WHISKERS, which
         is exactly what PetArt.ts refuses to draw. Generated from the same
         quadratic curves PetArt.lashes() uses, with head-local (0,0) placed
         at (149,138) — derived from the eye, which PetArt puts at (-49,22)
         and this file draws at (100,160). -->
    <g fill="#7a6494">
      <path d="M81.11 138.16L79.83 136.91L78.53 135.65L77.22 134.37L75.9 133.08L74.56 131.78L73.21 130.46L71.85 129.13L70.47 127.78L69.08 126.43L67.67 125.05L66.25 123.67L64.82 122.27A1.1 1.1 0 0 1 63.18 123.73L63.18 123.73L64.4 125.32L65.6 126.89L66.8 128.45L67.97 129.99L69.14 131.52L70.29 133.04L71.42 134.54L72.55 136.03L73.65 137.51L74.75 138.97L75.83 140.41L76.89 141.84A2.8 2.8 0 0 1 81.11 138.16Z"/>
      <path d="M75.39 147.57L74.13 147.02L72.88 146.49L71.62 145.97L70.37 145.47L69.12 144.98L67.87 144.51L66.63 144.05L65.38 143.61L64.14 143.18L62.9 142.77L61.67 142.37L60.43 141.99A1.1 1.1 0 0 1 59.57 144.01L59.57 144.01L60.67 144.64L61.76 145.29L62.86 145.95L63.95 146.62L65.04 147.3L66.13 147.99L67.21 148.7L68.3 149.42L69.38 150.16L70.46 150.9L71.54 151.66L72.61 152.43A2.8 2.8 0 0 1 75.39 147.57Z"/>
      <path d="M221.11 141.84L222.17 140.41L223.25 138.97L224.35 137.51L225.45 136.03L226.58 134.54L227.71 133.04L228.86 131.52L230.03 129.99L231.2 128.45L232.4 126.89L233.6 125.32L234.82 123.73A1.1 1.1 0 0 0 233.18 122.27L233.18 122.27L231.75 123.67L230.33 125.05L228.92 126.43L227.53 127.78L226.15 129.13L224.79 130.46L223.44 131.78L222.1 133.08L220.78 134.37L219.47 135.65L218.17 136.91L216.89 138.16A2.8 2.8 0 0 0 221.11 141.84Z"/>
      <path d="M225.39 152.43L226.46 151.66L227.54 150.9L228.62 150.16L229.7 149.42L230.79 148.7L231.87 147.99L232.96 147.3L234.05 146.62L235.14 145.95L236.24 145.29L237.33 144.64L238.43 144.01A1.1 1.1 0 0 0 237.57 141.99L237.57 141.99L236.33 142.37L235.1 142.77L233.86 143.18L232.62 143.61L231.37 144.05L230.13 144.51L228.88 144.98L227.63 145.47L226.38 145.97L225.12 146.49L223.87 147.02L222.61 147.57A2.8 2.8 0 0 0 225.39 152.43Z"/>
    </g>

    <!-- Muzzle: two cheek lobes over a shadow, so it sits proud of
         the face rather than being a pale smear. -->
    <ellipse cx="150" cy="211" rx="41" ry="25" fill="#ede2f6" />
    <g fill="#fdf6fb">
      <ellipse cx="131" cy="206" rx="26" ry="22" />
      <ellipse cx="169" cy="206" rx="26" ry="22" />
      <ellipse cx="150" cy="202" rx="31" ry="17" />
    </g>
    <!-- No long whiskers here either — see PetArt.ts. Six strokes
         reaching past the cheeks put more dark line on the face than
         the eyes carry, and they cross the head outline into the
         background, which reads as scratches. Only the roots stay. -->
    <path
      d="M141 194H159L157 200L150 207.5L143 200Z"
      fill="#ff9ec4"
      stroke="#7a6494"
      stroke-width="3.6"
      stroke-linejoin="round"
    />
    <ellipse cx="147" cy="197" rx="3" ry="1.7" fill="#fff3f8" opacity=".75" />
    <g fill="none" stroke="#7a6494" stroke-width="5" stroke-linecap="round">
      <path d="M150 207v3M150 210q-12 15-23-2M150 210q12 15 23-2" />
    </g>
  </g>
      </g>
    </g>
  </g>

  <g transform="translate(336 0)">
    <text x="0" y="196" font-family="Fredoka, system-ui, sans-serif" font-size="188"
          font-weight="700" letter-spacing="-5" fill="url(#word-ld)">Biskit</text>
    <text x="6" y="252" font-family="Fredoka, system-ui, sans-serif" font-size="40"
          font-weight="500" fill="#c9b8e8">A small cat who actually misses you</text>
  </g>
</svg>
